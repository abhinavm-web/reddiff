[package]
name = "reddiff"
version = "0.1.1"
edition = "2021"
authors = ["Abhinav Mahajan <abhinavmahajan91@gmail.com>"]
description = "Adversarial diff breaker with zero prose review comments"
repository = "https://github.com/abhinavm-web/reddiff"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
tempfile = "3.14"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
